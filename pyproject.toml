[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciranda-do-saber"
version = "0.1.0"
description = "Ciranda do Saber: Roda Viva da Aprendizagem Coletiva - Tutoria Coletiva com IA no Contraturno"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Fábio Linhares", email = "fabiolinharez@gmail.com" },
  { name = "Cristiano Estumano" },
  { name = "Luryan Delevati" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
